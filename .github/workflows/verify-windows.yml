name: Verify Windows PowerShell

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          ./tests/smoke.ps1
