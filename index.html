<!doctype html>
<!-- generated-html-library -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 자료실</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #18302b; background: #f6f7f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 900px; margin: auto; padding: 70px 24px; }
    .eyebrow { color: #526b62; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(2.4rem, 6vw, 4rem); letter-spacing: -.06em; margin: 14px 0; }
    .intro { color: #52645e; line-height: 1.7; }
    label { display: block; margin: 36px 0 9px; font-weight: 650; }
    input { width: 100%; font: inherit; padding: 17px 19px; border: 1px solid #b9c8bf; border-radius: 10px; background: white; color: inherit; }
    input:focus-visible, a:focus-visible { outline: 3px solid #2d8067; outline-offset: 4px; }
    #count { margin: 22px 0 12px; font-size: .9rem; color: #52645e; }
    ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid #d7dfd6; }
    li { border-bottom: 1px solid #d7dfd6; }
    a { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 21px 4px; color: #173e32; text-decoration: none; overflow-wrap: anywhere; }
    a:hover { background: #edf1e8; text-decoration: underline; }
    .arrow { color: #648173; flex-shrink: 0; }
    [hidden] { display: none !important; }
    #empty { padding: 30px 0; color: #52645e; }
    footer { margin-top: 38px; font-size: .8rem; color: #60746a; }
    @media (max-width: 540px) { main { padding-top: 36px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">HTML Library</div>
    <h1>HTML 자료실</h1>
    <p class="intro">만들어 둔 자료를 한곳에서 찾아보세요.<br>파일 이름이나 폴더 이름으로 검색할 수 있습니다.</p>
    <label for="search">자료 검색</label>
    <input id="search" type="search" placeholder="파일 이름으로 검색" autocomplete="off" aria-controls="files">
    <p id="count" role="status" aria-live="polite">전체 1개</p>
    <ul id="files">
        <li><a href="pages/welcome.html"><span>welcome.html</span><span class="arrow" aria-hidden="true">&#8599;</span></a></li>
    </ul>
    <p id="empty" hidden>검색 결과가 없습니다.</p>
    <noscript><p>검색하려면 JavaScript를 켜세요. 아래 파일 링크는 바로 열 수 있습니다.</p></noscript>
    <footer>파일 주소는 자료를 추가해도 그대로 유지됩니다.</footer>
  </main>
  <script>
    const search = document.getElementById('search');
    const rows = [...document.querySelectorAll('#files li')];
    const normalize = text => text.normalize('NFC').toLocaleLowerCase();
    const labels = rows.map(row => normalize(row.querySelector('a > span').textContent));
    const count = document.getElementById('count');
    const empty = document.getElementById('empty');
    function filterFiles() {
      const query = normalize(search.value.trim());
      let visible = 0;
      rows.forEach((row, i) => {
        row.hidden = !labels[i].includes(query);
        if (!row.hidden) visible++;
      });
      count.textContent = query ? `${visible}개 검색됨 · 전체 ${rows.length}개` : `전체 ${rows.length}개`;
      empty.textContent = rows.length ? '검색 결과가 없습니다.' : '아직 등록된 자료가 없습니다.';
      empty.hidden = visible !== 0;
    }
    search.addEventListener('input', filterFiles);
    filterFiles();
  </script>
</body>
</html>
