<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf1f5"><title>보석 광산 · 공부 화면 보상 체험</title><link rel="icon" href="assets/glass-mint.webp"><link rel="preload" href="assets/emerald-chest-open.webp" as="image"><link rel="stylesheet" href="vault.css?v=layout1"><script defer src="assets/study-zones.js?v=2"></script><script defer src="vault.js?v=layout1"></script><link rel="stylesheet" href="layout.css?v=layout1"></head>
<body>
<header class="lab"><div class="brand"><img src="assets/glass-mint.webp" alt=""><b>AiFather</b><span>보상 미리보기</span></div><div class="switch" aria-label="공부 화면 선택"><button data-child="seoa" aria-pressed="false">서아 화면</button><button data-child="seoin" aria-pressed="true">서인 화면</button></div></header>
<main><section class="previewControls" aria-label="레이아웃 미리보기">
<label>화면 <select id="surface"><option value="activity">단어 활동</option><option value="home">숙제 홈</option><option value="book">리딩 교재</option><option value="question">영어 공부질문</option></select></label>
<label>화면 크기 <select id="device"><option value="auto">현재 창</option><option value="320x568">작은 폰 · 320</option><option value="390x844">폰 세로 · 390</option><option value="768x1024">태블릿 세로 · 768</option><option value="800x360">폰 가로 · 800</option><option value="1024x600">태블릿 가로 · 1024</option></select></label>
<label>예시 잔액 <select id="sample"><option value="118900">118,900원</option><option value="0">0원</option><option value="9999999">9,999,999원</option><option value="offline">연결 확인</option></select></label>
<output id="sizeReadout" aria-label="실제 목업 너비"></output></section>
<div id="previewFrame"><section class="screen" aria-label="공부 화면과 보상 레이어">
<nav class="studybar" aria-label="공부 메뉴">
<button id="list" class="plain" aria-label="공부 목록" aria-expanded="false"><span aria-hidden="true">☷</span><b id="listLabel">목록</b></button>
<button id="wallet" class="pill wallet"><i class="coin" aria-hidden="true"></i><b id="balance">118,900원</b></button>
<button id="gem" class="pill" aria-label="모은 보석"><img id="hudArt" src="assets/glass-mint.webp" alt=""><strong id="gemText">4/5</strong></button>
<span id="lessonTitle"></span>
<div id="quickTools"></div>
<button id="menu" class="plain" aria-label="전체 메뉴" aria-expanded="false">☰</button></nav>
<div class="study" id="study"><div id="capture"><img id="studyImage" alt=""><div id="zones"></div></div><div id="samplePage" hidden></div></div>
<div id="toast" class="toast" hidden role="status"></div>
<section id="popover" class="popover" hidden aria-label="공부 메뉴 상세"><header><b id="popTitle"></b><button id="popClose" aria-label="닫기">×</button></header><div id="popBody"></div></section>
<div id="lootLayer" hidden>
  <div class="lootAnchor">
    <div class="aura" aria-hidden="true"></div>
    <div class="glints" aria-hidden="true"><i>✦</i><i>✧</i><i>✦</i><i>✧</i></div>
    <button id="chest" type="button" aria-label="보석상자 열기"><img id="chestArt" src="assets/emerald-chest.webp" alt=""></button>
    <ol id="drops" aria-label="꺼낸 금액"></ol>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
</section></div>
<div class="demo"><div><strong id="lessonName"></strong><span id="sampleSource">공부 화면 캡처 · 체험용 잔액</span></div><button id="simulate"><img src="assets/glass-mint.webp" alt=""> 공부 보상 체험 <b>+1</b></button></div>
<p id="tip"></p>
<section class="atelier" aria-label="보상 디자인 선택">
  <div class="palette"><h2 id="paletteTitle">보석 색</h2><div id="gemPalette" role="group" aria-labelledby="paletteTitle"></div></div>
  <div class="collection"><div class="collectionHead"><h2 id="collectionTitle">상자 도감</h2><button type="button" id="lidPreview" aria-pressed="false">열린 모습</button></div><div id="chestCollection" role="group" aria-labelledby="collectionTitle"></div></div>
</section>
</main><span class="sr" id="announce" role="status" aria-live="polite"></span>
</body></html>
