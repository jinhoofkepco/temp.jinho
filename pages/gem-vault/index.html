<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121720">
<meta name="description" content="공부 보석을 모으고 상자 속 다섯 장의 보상 카드를 열어보는 픽셀 아케이드 목업.">
<title>보석 광산 · GEM VAULT</title>
<link rel="icon" href="assets/gem.png"><link rel="preload" as="font" type="font/woff2" href="assets/Galmuri11-Bold.woff2" crossorigin>
<link rel="stylesheet" href="vault.css"><script defer src="vault.js"></script>
</head>
<body>
<header class="bar"><div class="nav">
<a class="brand" href="./" aria-label="보석 광산 홈"><img src="assets/gem.png" alt=""><span>GEM VAULT</span></a>
<div class="hud"><div class="wallet"><i class="coin" aria-hidden="true"></i><span>체험 잔액</span><strong id="balance">0원</strong></div>
<button id="audio" type="button" aria-pressed="false" aria-label="효과음 켜기" title="효과음 켜기"><span class="speaker"></span><span class="waves" aria-hidden="true">×</span></button></div>
</div></header>
<main>
<div class="intro"><div><h1>보석 광산</h1><p id="hint">보석 5개를 모아 상자를 열어 봐!</p></div><span class="preview">목업 체험</span></div>
<section class="arena" id="arena" aria-label="보석과 상자">
<div class="rays"></div><div class="aura"></div><div class="motes" aria-hidden="true"></div>
<div class="meter"><div class="meterHead"><b>모은 보석</b><strong><span id="count">4</span><small> / 5</small></strong></div><div class="segments" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
<button id="loot" type="button" aria-label="보석 1개 받기"><img src="assets/gem.png" alt="" id="relic"></button>
<div id="callout" aria-hidden="true"></div>
<button id="play" type="button"><img src="assets/gem.png" alt=""><span id="buttonText">보석 받기 +1</span></button>
</section>
<section class="rewards" aria-labelledby="rewardsTitle">
<div class="rewardHead"><div><h2 id="rewardsTitle"><i class="cardsIcon" aria-hidden="true"></i>상자 속 보상</h2><p>카드 5장 · 한 장에 1~10원</p></div>
<div class="boxTotal">이번 상자<strong><span id="total">0</span><small>원</small></strong></div></div>
<ol id="cards" aria-label="순서대로 열리는 다섯 장의 카드"></ol>
<p class="caption" id="caption">상자를 열면 카드가 한 장씩 뒤집혀.</p>
</section>
</main><canvas id="fx" aria-hidden="true"></canvas><div class="sr" role="status" id="announce" aria-live="polite" aria-atomic="true"></div>
</body></html>
