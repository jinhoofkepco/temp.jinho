<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101119"><title>Forward</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101119;color:#f4f1ee;font-family:system-ui,-apple-system,sans-serif}main{width:min(100%,960px);margin:auto;padding:24px 20px 40px}.top{display:flex;align-items:center;justify-content:space-between;color:#aaa9b4;font-size:.85rem;letter-spacing:.05em}.top strong{color:#eee;font-size:1rem;letter-spacing:.02em}.frame{margin:22px 0 0;background:#050507;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}.frame img{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in}.title{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#30334a,#11121b 70%);text-align:center}.title h1{font-family:Georgia,serif;font-size:clamp(3rem,10vw,6rem);font-weight:400;letter-spacing:.04em;margin:0}.title p{color:#c3c1cd;letter-spacing:.13em;font-size:.78rem;text-transform:uppercase}.copy{max-width:710px;margin:25px auto 0;min-height:8rem}.copy p{font-family:Georgia,serif;font-size:clamp(1.12rem,2.5vw,1.3rem);line-height:1.75;margin:0}.ko{margin-top:18px!important;color:#c5c2cc;font-family:system-ui,sans-serif!important;font-size:1rem!important;line-height:1.75!important}.toggle{background:none;border:0;color:#c2b5e3;text-decoration:underline;text-underline-offset:4px;padding:12px 0;cursor:pointer;font:inherit}.nav{max-width:710px;margin:22px auto 0;display:flex;justify-content:space-between;gap:16px}button.navbtn{border:1px solid #777582;background:#242530;color:#fff;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer;min-width:100px}button.navbtn:disabled{opacity:.35;cursor:default}button:focus-visible,img:focus-visible{outline:3px solid #d4c1ff;outline-offset:4px}dialog{border:0;padding:0;background:#050507;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh}dialog::backdrop{background:#000}dialog img{width:100%;height:100%;object-fit:contain}dialog button{position:absolute;right:16px;top:16px;background:#222c;color:white;border:1px solid #aaa;border-radius:50%;font-size:1.5rem;width:44px;height:44px;cursor:pointer}@media(max-width:500px){main{padding:18px 16px 30px}.frame{margin-top:18px}.copy{min-height:0;margin-top:20px}.copy p{line-height:1.65}.nav{margin-top:18px}}
</style></head><body><main><div class="top"><strong>Forward</strong><span id="counter"></span></div><div class="frame" id="frame"></div><section class="copy" aria-live="polite"><p id="text"></p><button class="toggle" id="toggle" type="button" hidden aria-expanded="false">Show Korean</button><p class="ko" id="ko" hidden lang="ko"></p></section><nav class="nav" aria-label="Story navigation"><button class="navbtn" id="prev" type="button">← Prev</button><button class="navbtn" id="next" type="button">Start →</button></nav></main><dialog id="viewer" aria-label="Full screen illustration"><button id="close" aria-label="Close full screen">×</button><img id="large" alt=""></dialog>
<script>
const scenes=[{"number": 1, "text": "Our crew had four girls, one song, and one solo, and the solo was Jiwoo's. Every day after school she practised the turn in our empty classroom, and every day her foot slipped at the same moment. I filmed her so she could watch it later. Mostly, though, I watched it myself. I could do that turn, I kept thinking. I could do it better.", "ko": "우리 댄스 크루의 솔로는 지우 몫이었다. 나는 연습하는 지우를 찍어 주며 생각했다. 저 턴, 나도 할 수 있는데."}, {"number": 2, "text": "At eleven that night, Jiwoo sent me a voice message. \"Mira, don't tell anyone,\" she whispered. \"I'm so scared of the solo I feel sick. What if I freeze in front of everyone?\" A minute later Sujin, our leader, texted me: \"Is Jiwoo okay for the solo? Be honest.\" My thumb found the Forward button. It took one second.", "ko": "지우가 음성 메시지를 보냈다. \"아무한테도 말하지 마. 솔로가 너무 무서워.\" 수진이 물었다. \"지우 솔로 괜찮아? 솔직하게.\" 내 엄지가 '전달'을 눌렀다. 1초 걸렸다."}, {"number": 3, "text": "By morning, Sujin had shared it in the class chat. Someone added a crying-laughing face, and then twenty more people did. When I walked into the classroom, Jiwoo was sitting perfectly still, staring at her phone. Her own voice was coming out of somebody's speaker at the back of the room.", "ko": "아침에는 그 메시지가 반 단톡방에 올라와 있었다. 지우는 꼼짝 않고 휴대폰만 보고 있었다. 교실 뒤에서 지우 목소리가 흘러나왔다."}, {"number": 4, "text": "Jiwoo found me on the stairs. \"Did you tell anyone?\" she asked. \"No,\" I said. \"I'd never.\" She looked at me for a long moment and believed me. That was the worst part. \"Then it was Ara,\" she said. \"She sits right behind me. She's always looking at me.\" I didn't say anything. I nodded.", "ko": "\"누구한테 말했어?\" \"아니. 절대 안 하지.\" 지우는 나를 믿었다. 그게 제일 나빴다. \"그럼 아라야.\" 나는 고개를 끄덕였다."}, {"number": 5, "text": "At practice, Sujin held out the silver star hairpin, the one only the soloist wears. \"Jiwoo's too scared, right? You take the solo.\" Everybody looked at me. Jiwoo was standing by the wall with her arms wrapped around herself. I took the hairpin. It weighed almost nothing.", "ko": "수진이 솔로만 꽂는 은색 별 핀을 내밀었다. \"지우는 무서워하잖아. 네가 해.\" 나는 핀을 받았다. 거의 무게가 없었다."}, {"number": 6, "text": "Nobody said anything mean to Ara. That was almost worse. People just moved. At lunch, the seats around her were empty, and the girls who used to borrow her pencils didn't anymore. Ara ate quietly with her sketchbook under her hand, as if she were waiting for someone to explain what she had done.", "ko": "아무도 아라에게 나쁜 말을 하지 않았다. 그냥 다들 자리를 옮겼다. 아라는 스케치북에 손을 얹고 조용히 밥을 먹었다."}, {"number": 7, "text": "After school I found Ara's sketchbook open on a table in the art room. Page after page was Jiwoo: Jiwoo laughing, Jiwoo with her glasses pushed up, Jiwoo in the middle of the turn, arms opening like a door. Ara hadn't been looking at Jiwoo's phone. She'd been drawing her, because she thought Jiwoo was amazing. So did I, once.", "ko": "아라의 스케치북에는 지우가 가득했다. 턴을 도는 지우까지. 아라는 지우 휴대폰을 본 게 아니었다. 지우를 그리고 있었다."}, {"number": 8, "text": "At midnight Jiwoo texted the crew: \"I'm not coming tomorrow. Mira can do it.\" If she stayed home, nobody would ever ask any more questions. The solo would be mine, and Ara would just be the weird new girl forever. It was the easiest thing in the world. I didn't have to do anything at all.", "ko": "\"내일 안 갈게. 미라가 하면 돼.\" 지우가 안 오면 아무도 더 묻지 않는다. 솔로는 내 것이 된다. 아무것도 안 하면 됐다."}, {"number": 9, "text": "But Jiwoo came. Ten minutes before the show, she was standing in the corner backstage in her red hoodie, her costume folded over her arm, as if she hadn't decided yet whether to put it on. The music for the group before us was booming through the curtain. The stage light cut across the floor between us like a line I was supposed to cross.", "ko": "그런데 지우가 왔다. 공연 10분 전, 무대 뒤 구석에 의상을 팔에 걸친 채 서 있었다. 무대 조명이 우리 사이 바닥에 선을 그었다."}, {"number": 10, "text": "I took the star out of my hair. \"It was me,\" I said, loud enough for everyone to hear. \"I sent your message to Sujin. Not Ara. Ara never did anything.\" Nobody moved. \"The solo is yours. It was always yours.\" I held out the hairpin. Jiwoo didn't take it right away. She just looked at me as if she had never seen me before.", "ko": "나는 머리에서 별 핀을 뺐다. \"나였어. 내가 수진이한테 보냈어. 아라가 아니야. 솔로는 원래 네 거야.\" 지우는 한참 나를 보기만 했다."}, {"number": 11, "text": "Jiwoo took the hairpin. She didn't say she forgave me. She said, \"Stand in the wings, where I can see you.\" So I did. When the solo started, I could see her legs shaking. She looked at me once, and then she turned. Her foot didn't slip. Not this time.", "ko": "지우는 핀을 받았다. 용서한다는 말은 없었다. \"내가 볼 수 있는 데 서 있어.\" 지우의 다리가 떨렸다. 그리고 지우는 돌았다. 이번엔 미끄러지지 않았다."}, {"number": 12, "text": "That night I wrote in the class chat: \"Jiwoo's message was sent by me, not Ara. Ara, I'm sorry.\" It got no likes at all. The next day I sat down next to Ara in the art room. She didn't say anything. She just turned her sketchbook toward me. Jiwoo was on the stage, spinning, and in the dark at the side of the page there was a small girl, watching. Jiwoo still doesn't send me voice messages. Maybe someday.", "ko": "반 단톡방에 썼다. \"지우 메시지는 내가 보냈어. 아라야, 미안해.\" 다음 날 아라 옆에 앉았다. 아라가 새 그림을 보여 줬다. 무대 위 지우, 그리고 옆에서 지켜보는 작은 아이."}]; let page=0, showKo=false; const $=id=>document.getElementById(id); const frame=$('frame');
function render(){const s=scenes[page-1];$('counter').textContent=page?`${page} / ${scenes.length}`:'A story';frame.replaceChildren();if(!s){const card=document.createElement('div');card.className='title';card.innerHTML='<h1>Forward</h1><p>A story in twelve scenes</p>';frame.append(card)}else{const img=document.createElement('img');img.src=`images/scene-${String(page).padStart(2,'0')}.jpg`;img.alt=`Illustration for scene ${page}`;img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label',`Open scene ${page} illustration full screen`);img.onclick=openImage;img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openImage()}};frame.append(img)}$('text').textContent=s?s.text:'A story about a choice, a secret, and finding the courage to tell the truth.';$('ko').textContent=s?s.ko:'';$('toggle').hidden=!s;$('ko').hidden=!s||!showKo;$('toggle').textContent=showKo?'Hide Korean':'Show Korean';$('toggle').setAttribute('aria-expanded',String(showKo));$('prev').disabled=page===0;$('next').disabled=page===scenes.length;$('next').textContent=page===0?'Start →':'Next →'}
function move(n){page=Math.max(0,Math.min(scenes.length,page+n));showKo=false;render()}function openImage(){if(!page)return;$('large').src=frame.querySelector('img').src;$('large').alt=`Scene ${page} illustration`;$('viewer').showModal()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('toggle').onclick=()=>{showKo=!showKo;render()};$('close').onclick=()=>$('viewer').close();$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').close()};document.addEventListener('keydown',e=>{if($('viewer').open)return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let x=0,y=0;frame.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});frame.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)move(dx<0?1:-1)},{passive:true});render();
</script></body></html>
