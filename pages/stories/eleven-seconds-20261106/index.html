<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101117"><title>Eleven Seconds</title><style>
*{box-sizing:border-box}html{background:#101117;color:#f2f0ec}body{margin:0;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f4c77b;outline-offset:3px}.app{max-width:960px;margin:auto;padding:24px clamp(18px,5vw,48px) 40px}.top{display:flex;justify-content:space-between;align-items:center;color:#aaaab5;font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;min-height:32px}.top strong{color:#ece7df;font-weight:600}.screen{margin-top:20px}.cover{min-height:min(65vh,600px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(24px,7vw,72px);background:linear-gradient(140deg,#29252f,#171921 65%,#242029);border:1px solid #3a3640}.eyebrow{color:#d6ad71;font-size:.75rem;letter-spacing:.19em;text-transform:uppercase}.cover h1{font-family:Georgia,serif;font-size:clamp(3.5rem,11vw,7rem);font-weight:400;letter-spacing:-.05em;line-height:.94;margin:24px 0}.cover p{color:#c5c2c4;max-width:30ch;line-height:1.6}.primary{background:#e9c183;color:#181516;border:0}.cover button{margin-top:22px}.frame{display:block;width:100%;aspect-ratio:16/9;background:#050507;border:0;padding:0;overflow:hidden}.frame img{display:block;width:100%;height:100%;object-fit:contain}.missing{height:100%;display:grid;place-items:center;color:#a7a5ae;font-size:.9rem;letter-spacing:.04em}.hint{color:#95949e;font-size:.75rem;margin:9px 0 0;text-align:right}.copy{max-width:700px;margin:32px auto 0}.scene-label{color:#d6ad71;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}.copy h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(1.7rem,4vw,2.5rem);margin:10px 0 20px}.english{font-family:Georgia,serif;font-size:clamp(1.15rem,2.4vw,1.4rem);line-height:1.75;margin:0;color:#f2efeb}.translation{margin-top:25px;border-top:1px solid #383841;padding-top:15px}.translation summary{cursor:pointer;color:#c9c4bd;font-size:.9rem;width:max-content}.translation p{line-height:1.8;color:#c6c4c5}.nav{display:flex;justify-content:space-between;gap:16px;margin:36px auto 0;max-width:700px}.nav button,.cover button{padding:13px 20px;border-radius:3px;min-width:100px}.secondary{background:transparent;border:1px solid #55535a;color:#e3dfda}.nav button:disabled{opacity:.35;cursor:default}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);display:grid;place-items:center;z-index:3;padding:18px}.lightbox[hidden]{display:none}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:16px;top:16px;background:#25252b;color:white;border:1px solid #777;padding:10px 14px}.lightbox img{width:auto;height:auto}@media(max-width:450px){.app{padding:16px 18px 32px}.screen{margin-top:14px}.copy{margin-top:25px}.cover{min-height:65vh}.english{font-size:1.15rem}}
</style></head><body><main class="app"><header class="top"><strong>Eleven Seconds</strong><span id="progress">A story in 12 scenes</span></header><div id="screen" class="screen"></div><nav class="nav" aria-label="Story navigation"><button class="secondary" id="prev">← Prev</button><button class="primary" id="next">Next →</button></nav></main><div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Enlarged scene image"><button class="close" id="close">Close ✕</button><img id="large" alt=""></div><script>
const scenes=[{"n": 1, "title": "Eleven seconds", "text": "The video was eleven seconds long. A rider in a red helmet flew off the top of the Seven, the board spun once under his feet, and he landed clean. Everyone at our school has seen it by now. I filmed it. I didn't ride it. The rider was Dae. The helmet was mine.", "ko": "11초짜리 영상. 빨간 헬멧을 쓴 아이가 '세븐' 계단을 날아 깔끔하게 착지한다. 찍은 건 나, 탄 건 대, 헬멧만 내 것이었다."}, {"n": 2, "title": "\"Finally.\"", "text": "That night I posted it with one word: \"Finally.\" I meant that Dae had finally landed it after a month of trying. Then I put my phone down and went to sleep. When I woke up, the video had four thousand views. Every comment had my name in it.", "ko": "\"드디어.\" 한마디만 달아 올렸다. 대가 드디어 성공했다는 뜻이었다. 아침에 보니 댓글마다 내 이름이었다."}, {"n": 3, "title": "\"Yeah.\"", "text": "At school, people I had never talked to were waiting at my locker. Ha-eun from the student council pushed through and held up her phone. \"Was that really you?\" Everyone went quiet. Down the hall, Dae was standing at his locker. He could hear us. \"Yeah,\" I said. It was the easiest word I had ever said.", "ko": "학생회 하은이 물었다. \"그거 진짜 너야?\" 복도 끝에서 대가 듣고 있었다. \"응.\" 내가 해 본 말 중 제일 쉬운 말이었다."}, {"n": 4, "title": "The middle table", "text": "At lunch I sat at the middle table for the first time in my life. Ha-eun said the school festival would open on Friday with me riding the Seven, in front of everyone. The whole table cheered. I laughed too. Across the room, Dae was eating alone by the window, his board leaning against his chair, the way it always did.", "ko": "처음으로 가운데 테이블에 앉았다. 금요일 축제를 내가 '세븐'으로 연다고 했다. 창가에서는 대가 혼자 밥을 먹고 있었다."}, {"n": 5, "title": "Eleven falls", "text": "That evening I went to the Seven alone. I tried eleven times. Eleven times the board went one way and I went the other. My elbow was bleeding through my sleeve. Eleven seconds of video, I thought, and I couldn't even do one.", "ko": "저녁에 혼자 '세븐'에 갔다. 열한 번 시도했고 열한 번 다 넘어졌다. 영상은 11초였는데, 나는 한 번도 못 했다."}, {"n": 6, "title": "\"Go home, Dae.\"", "text": "Dae came down the stairs with my board. I didn't know how long he had been watching. \"You turn your shoulders too early,\" he said. \"I can show you.\" \"Go home, Dae,\" I said. \"If someone sees us here, they'll think...\" I didn't finish. I didn't have to. He put the board down beside me and left.", "ko": "대가 내 보드를 주워 왔다. \"어깨가 너무 빨리 돌아. 알려 줄게.\" \"집에 가, 대. 누가 보면….\" 대는 보드를 내려놓고 갔다."}, {"n": 7, "title": "Saying nothing", "text": "On Thursday some boys found Dae practising on the Seven. \"Look, it's Jun's fan club!\" one of them shouted. \"Do it like Jun!\" Dae didn't answer. He picked up his board and walked away. I stood with them, holding my red helmet, and said nothing. That was my second lie. It didn't even need words.", "ko": "아이들이 대를 놀렸다. \"준처럼 해 봐!\" 대는 대답 없이 갔다. 나는 아무 말도 하지 않았다. 그게 두 번째 거짓말이었다."}, {"n": 8, "title": "Two easy ways out", "text": "At midnight, Ha-eun texted: \"Whole school's coming. Don't be late, legend.\" I could ride tomorrow and fall in front of everyone. Or I could limp in and say I'd twisted my ankle, and no one would ever know. Both were easy. Both were lies. I sat there holding the helmet until my hands were warm.", "ko": "\"내일 전교생 다 와. 늦지 마, 전설.\" 넘어지든지, 발목을 삐었다고 하든지. 둘 다 쉬웠다. 둘 다 거짓말이었다."}, {"n": 9, "title": "Three, two", "text": "On Friday, the whole school was packed around the bottom of the Seven. A hundred phones were up, waiting for the video to happen again. Ha-eun counted down into the microphone. \"Three... two...\" From the top, the stairs looked twice as long as they did on video.", "ko": "금요일, 전교생이 '세븐' 아래에 모였다. 휴대폰 백 개가 나를 향했다. \"셋… 둘….\""}, {"n": 10, "title": "\"It wasn't me.\"", "text": "I stepped off the board and took the microphone. \"It wasn't me,\" I said. My voice came out too loud. \"In the video. It was Dae Park. I just filmed it. I let everyone think it was me, and I lied.\" Nobody said anything. Somewhere in the crowd, one phone went down. Then another.", "ko": "\"그거 나 아니야. 대였어. 나는 찍기만 했어. 그리고 거짓말했어.\" 아무도 말이 없었다. 휴대폰이 하나, 또 하나 내려갔다."}, {"n": 11, "title": "The helmet", "text": "I walked down through the crowd. People stepped aside without a word. Dae was at the very back, his board under his arm. I held out the helmet. \"You should ride,\" I said. \"Only if you want to.\" He looked at the helmet for a long time. Then he took it.", "ko": "맨 뒤에 있던 대에게 헬멧을 내밀었다. \"네가 타. 하고 싶으면.\" 대는 한참 헬멧을 보다가 받아 들었다."}, {"n": 12, "title": "The best angle", "text": "Dae landed it. The crowd roared, and for a few seconds nobody looked at me at all. That was fine. I was crouched at the bottom with my phone, and I had the best angle. I always had. That night I changed the caption under the old video: \"Rider: Dae Park. Camera: Kim Jun.\" It got fewer likes. It was true.", "ko": "대가 착지했다. 아무도 나를 보지 않았지만 괜찮았다. 제일 좋은 각도는 늘 내 자리였다. 그날 밤 캡션을 바꿨다. \"라이더: 박대. 촬영: 김준.\""}]; let current=0; const screen=document.getElementById('screen'), prev=document.getElementById('prev'), next=document.getElementById('next'), progress=document.getElementById('progress'), lightbox=document.getElementById('lightbox'), large=document.getElementById('large');
function render(){lightbox.hidden=true;prev.disabled=current===0;next.textContent=current===0?'Start reading →':current===12?'Back to title':'Next →';progress.textContent=current===0?'A story in 12 scenes':`${String(current).padStart(2,'0')} / 12`;if(!current){screen.innerHTML='<section class="cover"><span class="eyebrow">A story in twelve scenes</span><h1>Eleven<br>Seconds</h1><p>One video. One word. And a truth waiting to be told.</p><button class="primary" id="start">Start reading →</button></section>';document.getElementById('start').onclick=()=>go(1);return}const s=scenes[current-1];screen.innerHTML=`<section aria-labelledby="scene-title"><button class="frame" id="frame" aria-label="Enlarge scene image"><img id="scene-image" src="images/scene-${String(s.n).padStart(2,'0')}.jpg" alt="Illustration for scene ${s.n}"></button><p class="hint" id="hint">Tap image to enlarge</p><div class="copy"><div class="scene-label">Scene ${String(s.n).padStart(2,'0')}</div><h2 id="scene-title"></h2><p class="english"></p><details class="translation"><summary>한국어 보기 · Korean</summary><p lang="ko"></p></details></div></section>`;screen.querySelector('h2').textContent=s.title;screen.querySelector('.english').textContent=s.text;screen.querySelector('[lang=ko]').textContent=s.ko;const img=document.getElementById('scene-image'),frame=document.getElementById('frame');img.onerror=()=>{frame.outerHTML='<div class="frame"><div class="missing">Illustration unavailable</div></div>';document.getElementById('hint').remove()};frame.onclick=()=>{large.src=img.src;large.alt=img.alt;lightbox.hidden=false;document.getElementById('close').focus()}}
function go(n){current=Math.max(0,Math.min(12,n));render();window.scrollTo(0,0)}prev.onclick=()=>go(current-1);next.onclick=()=>go(current===12?0:current+1);function close(){lightbox.hidden=true;document.getElementById('frame')?.focus()}document.getElementById('close').onclick=close;lightbox.onclick=e=>{if(e.target===lightbox)close()};document.addEventListener('keydown',e=>{if(!lightbox.hidden){if(e.key==='Escape')close();return}if(e.key==='ArrowRight')go(current===12?12:current+1);if(e.key==='ArrowLeft')go(current-1)});let x=0,y=0;screen.addEventListener('touchstart',e=>{x=e.changedTouches[0].screenX;y=e.changedTouches[0].screenY},{passive:true});screen.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-x,dy=e.changedTouches[0].screenY-y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)go(current+(dx<0?1:-1))},{passive:true});render();
</script></body></html>
