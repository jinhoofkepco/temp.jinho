<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pressure</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#080e15;color:#edf2f5}*{box-sizing:border-box}body{margin:0;min-width:0}main{max-width:1060px;margin:auto;padding:clamp(18px,4vw,42px) 20px 30px}.top{display:flex;justify-content:space-between;align-items:center;color:#aabcc8;font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;margin-bottom:18px}.stage{background:#000;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in}.title-card{height:100%;width:100%;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at 50% 70%,#17384b,#0a1621 55%,#070d14)}h1{font-family:Georgia,serif;font-size:clamp(3rem,10vw,7rem);font-weight:400;letter-spacing:.04em;margin:0}.subtitle{color:#a9c8d5;letter-spacing:.22em;text-transform:uppercase;font-size:.7rem;margin-top:12px}.copy{max-width:700px;margin:clamp(24px,4vw,40px) auto;min-height:125px}.copy p{font-family:Georgia,serif;font-size:clamp(1.12rem,2.3vw,1.45rem);line-height:1.65;margin:0}.label{font-size:.75rem;color:#9ab8c5;margin-bottom:10px}.ko{font-family:system-ui,sans-serif!important;font-size:1rem!important;color:#b8cbd3;margin-top:16px!important;line-height:1.7!important}.toggle{background:none;border:0;color:#9dbdc9;padding:12px 0;cursor:pointer;font:inherit;font-size:.82rem;text-decoration:underline;text-underline-offset:4px}.nav{max-width:700px;margin:auto;display:flex;justify-content:space-between;gap:12px}button.navbtn{background:#1b3543;color:#fff;border:1px solid #42606f;border-radius:4px;padding:12px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.35;cursor:default}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;align-items:center;justify-content:center;z-index:5;padding:12px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:15px;top:15px;background:#172b35;color:white;border:1px solid #60727c;border-radius:4px;padding:10px 14px;cursor:pointer}@media(max-width:400px){main{padding:18px 16px 24px}.copy{min-height:150px}}
</style></head><body><main><div class="top"><span>Pressure</span><span id="count"></span></div><div class="stage" id="stage"></div><div class="copy" id="copy" aria-live="polite"></div><nav class="nav" aria-label="Story navigation"><button class="navbtn" id="prev">← Prev</button><button class="navbtn" id="next">Next →</button></nav></main><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Full screen image"><button class="close" id="close">Close ✕</button><img id="large" alt=""></div><script>
const scenes=[{"n": 1, "title": "Coral Nine", "en": "Ji-an was the only kid at the bottom of the sea. Every morning she checked the pipes, and every morning Commander Baek found something wrong. Red pen, red pen, red pen.", "ko": "지안은 바닷속 기지의 유일한 아이였다. 매일 아침 배관을 점검했고, 매일 아침 백 대장은 빨간 펜으로 틀린 곳을 찾았다."}, {"n": 2, "title": "Sensor fault", "en": "That night an alarm went off. Ji-an watched through the hatch as the commander switched it off. In the station log, he wrote two words: sensor fault. The inspectors were coming in the morning.", "ko": "밤에 경보가 울렸다. 대장은 경보를 끄고 기록에 두 단어를 적었다. '센서 고장.' 내일 아침 검사관들이 온다."}, {"n": 3, "title": "The crawlway", "en": "The ballast tunnel was too narrow for any grown-up. It was not too narrow for Ji-an. Deep inside, her light found it: a thin crack, and tiny drops of the sea creeping in. Drip. Drip. Drip. She pressed record.", "ko": "어른은 못 들어가는 좁은 통로. 지안은 들어갈 수 있었다. 불빛에 가느다란 금이 보였다. 똑, 똑, 똑. 지안은 녹화 버튼을 눌렀다."}, {"n": 4, "title": "Ten years", "en": "\"If the inspectors find a problem,\" the commander said quietly, \"they close Coral Nine. Ten years of work. Your mother's job too.\" He looked at her wrist. \"Some things are better fixed quietly, Ji-an.\"", "ko": "\"문제가 보이면 기지는 문을 닫는다. 10년의 연구도, 네 엄마 일자리도.\" 대장이 지안의 손목을 봤다. \"어떤 건 조용히 고치는 게 나아.\""}, {"n": 5, "title": "The briefing", "en": "At the briefing, Ji-an asked to show one thing. The screen filled with her video: the crack, and the slow drops of the sea. \"This is not a sensor fault,\" she said. Her voice shook. The picture didn't.", "ko": "아침 회의에서 지안이 영상 하나를 띄웠다. 금, 그리고 천천히 스며드는 물방울. \"센서 고장이 아니에요.\" 목소리는 떨렸다. 화면은 떨리지 않았다."}, {"n": 6, "title": "Lesson one", "en": "Coral Nine was repaired, not closed. Now Ji-an teaches crawlway safety every Monday. Her slowest student is very tall, and he takes a lot of notes. Red pen, red pen, red pen.", "ko": "기지는 닫히지 않고 수리됐다. 이제 매주 월요일 지안이 통로 안전 교육을 한다. 제일 느린 학생은 키가 아주 크다. 빨간 펜, 빨간 펜, 빨간 펜."}];let page=0,showKo=false;const stage=document.querySelector('#stage'),copy=document.querySelector('#copy'),viewer=document.querySelector('#viewer');function render(){document.querySelector('#count').textContent=page?`${page} / ${scenes.length}`:'A story';document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===scenes.length;if(!page){stage.innerHTML='<div class="title-card"><h1>Pressure</h1></div>';copy.innerHTML='';return}let s=scenes[page-1];stage.innerHTML=`<img src="images/scene-${String(page).padStart(2,'0')}.jpg" alt="Scene ${page}: ${s.title}. Tap to enlarge.">`;stage.firstElementChild.onclick=()=>{document.querySelector('#large').src=stage.firstElementChild.src;document.querySelector('#large').alt=stage.firstElementChild.alt;viewer.classList.add('open');document.querySelector('#close').focus()};copy.innerHTML='';let focal=s.title.match(/ — (.+)$/);if(focal){let label=document.createElement('div');label.className='label';label.textContent=focal[1];copy.append(label)}let p=document.createElement('p');p.textContent=s.en;copy.append(p);let b=document.createElement('button');b.className='toggle';b.textContent=showKo?'Hide Korean':'한국어 보기';b.setAttribute('aria-expanded',showKo);b.onclick=()=>{showKo=!showKo;render()};copy.append(b);if(showKo){let k=document.createElement('p');k.className='ko';k.lang='ko';k.textContent=s.ko;copy.append(k)}}function go(delta){page=Math.max(0,Math.min(scenes.length,page+delta));render()}document.querySelector('#prev').onclick=()=>go(-1);document.querySelector('#next').onclick=()=>go(1);document.querySelector('#close').onclick=()=>viewer.classList.remove('open');viewer.onclick=e=>{if(e.target===viewer)viewer.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')viewer.classList.remove('open');else if(!viewer.classList.contains('open')&&e.key==='ArrowRight')go(1);else if(!viewer.classList.contains('open')&&e.key==='ArrowLeft')go(-1)});let startX=0,startY=0;stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?1:-1)},{passive:true});render();
</script></body></html>
