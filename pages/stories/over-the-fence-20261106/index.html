<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Over the Fence</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}html{background:#111214;color:#f7f5ef;font-family:system-ui,-apple-system,sans-serif}body{margin:0;min-width:0}main{width:min(100%,960px);margin:auto;padding:clamp(16px,4vw,36px)}.top{display:flex;justify-content:space-between;align-items:center;color:#c4c0b8;font-size:.85rem;letter-spacing:.06em}.stage{margin-top:20px;aspect-ratio:16/9;background:#000;display:grid;place-items:center;overflow:hidden}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}.cover{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:radial-gradient(ellipse at center,#3b3329,#17191a 75%);padding:20px}.cover h1{font-family:Georgia,serif;font-size:clamp(2.4rem,9vw,5.4rem);line-height:1;margin:0}.cover p{color:#e8bc79;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem}.copy{max-width:740px;margin:24px auto 0;min-height:150px}.english{font-family:Georgia,serif;font-size:clamp(1.16rem,2.5vw,1.4rem);line-height:1.65;margin:0}.ko{color:#d5cec0;line-height:1.75;font-size:1rem}.toggle{margin-top:18px;background:none;color:#dfbf8b;border:0;padding:8px 0;cursor:pointer;font-size:.9rem}.nav{display:flex;justify-content:space-between;gap:16px;max-width:740px;margin:24px auto}.nav button{font:inherit;font-weight:700;border:1px solid #777166;border-radius:999px;background:#262727;color:#fff;padding:12px 24px;cursor:pointer}.nav button:last-child{background:#efbd72;color:#211a10;border-color:#efbd72}.nav button:disabled{opacity:.35;cursor:default}button:focus-visible,img:focus-visible{outline:3px solid #f5c979;outline-offset:4px}.overlay{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:2;padding:16px}.overlay[hidden]{display:none}.overlay img{max-width:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:16px;top:16px;border:1px solid #aaa;border-radius:50%;background:#222;color:white;width:44px;height:44px;font-size:1.5rem;cursor:pointer}@media(max-width:450px){main{padding:16px}.stage{margin-top:15px}.copy{margin-top:20px;min-height:0}.nav{margin-top:24px}.nav button{padding:11px 20px}}
</style></head><body><main><div class="top"><span>OVER THE FENCE</span><span id="count"></span></div><div class="stage" id="stage"><div class="cover" id="cover"><p>A story in twelve scenes</p><h1>Over the Fence</h1><p>Press next to begin</p></div><img id="picture" hidden alt=""></div><section class="copy" aria-live="polite"><p class="english" id="english"></p><button class="toggle" id="toggle" hidden aria-expanded="false">Show Korean</button><p class="ko" id="ko" lang="ko" hidden></p></section><nav class="nav" aria-label="Story navigation"><button id="prev">← Prev</button><button id="next">Next →</button></nav></main><div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-label="Enlarged scene"><button class="close" id="close" aria-label="Close enlarged image">×</button><img id="large" alt=""></div>
<script>
const scenes=[{"n": 1, "text": "Every Saturday we played on the lot behind Mr. Kang's fence. My best move was the rocket kick. It had all the power in the world and no aim at all. \"Careful!\" Minsu yelled. \"Anything that goes over that fence is gone forever!\" Everybody knew that rule.", "ko": "내 필살기는 '로켓 킥'. 힘은 세지만 어디로 갈지는 모른다. \"조심해! 저 담 넘어가면 영영 끝이야!\""}, {"n": 2, "text": "This time the rocket kick went higher than ever. It flew over the fence, over the persimmon tree, and straight into Mr. Kang's greenhouse. CRASH! For one second nobody breathed.", "ko": "로켓 킥이 담을 넘어 강 할아버지네 온실 유리를 깨뜨렸다. 쨍그랑! 아무도 숨을 쉬지 못했다."}, {"n": 3, "text": "Mr. Kang came out holding my ball. He was even bigger up close. \"Whose ball is this?\" he asked. \"It wasn't us!\" I said, before I could think. His eyes moved to Tae, the new kid, who was standing right by the fence with a ball under his arm. I didn't say anything else.", "ko": "\"이 공 누구 거냐?\" \"저희 아니에요!\" 할아버지의 눈이 담 옆에 공을 들고 선 전학생 태에게 갔다. 나는 더 말하지 않았다."}, {"n": 4, "text": "At dinner Mom asked where Dad's ball was. \"I lent it to Minsu,\" I said. That was lie number two. The big match against the sixth graders was on Saturday, and we had no ball. From my window I could see the cardboard over the broken glass, and something strange: a pair of old orange gloves hanging by the greenhouse door.", "ko": "\"공은?\" \"민수 빌려줬어요.\" 두 번째 거짓말. 토요일엔 6학년이랑 큰 시합인데 공이 없다. 창밖, 온실 문 옆에 낡은 주황색 장갑이 걸려 있었다."}, {"n": 5, "text": "On Monday, Tae wasn't allowed near the lot anymore. Mr. Kang had talked to his mom. Tae kicked his ball against the school wall at lunch, all by himself. Thump. Thump. Thump. Every thump felt like it was hitting me.", "ko": "태는 이제 공터에 못 온다. 점심시간, 태 혼자 벽에 공을 찼다. 쿵, 쿵, 쿵. 그 소리가 나를 때리는 것 같았다."}, {"n": 6, "text": "On Wednesday morning I saw something on Tae's doorstep. It was his old brown ball, the one that had gone over the fence last week. Someone had pumped it up and sewn it with bright red thread. Weird, I thought. It's a trap. It has to be a trap.", "ko": "태네 문 앞에 지난주 담을 넘어간 갈색 공이 있었다. 바람이 빵빵하고 빨간 실로 꿰매져 있었다. 함정이야, 분명히."}, {"n": 7, "text": "On Friday we sat on the bricks with no ball. \"No ball, no match,\" said Minsu. \"The sixth graders will say we chickened out.\" Then he pointed at the fence. \"Go in tonight and take it back. He'll never know.\" It was a good plan. It was just another lie with legs.", "ko": "\"공 없으면 시합도 없어.\" 민수가 담을 가리켰다. \"오늘 밤 몰래 들어가서 가져와.\" 좋은 계획 같았다. 그냥 다리 달린 거짓말이었다."}, {"n": 8, "text": "That night I went to the fence. Then I kept walking, past the fence, all the way to the front gate. Minsu was waving at me like crazy. My finger shook on the old brass bell. I pressed it anyway.", "ko": "나는 담을 지나 대문까지 걸어갔다. 민수가 미친 듯이 손을 흔들었다. 떨리는 손가락으로 벨을 눌렀다."}, {"n": 9, "text": "The door opened, and Mr. Kang looked down at me. \"It was my ball,\" I said. \"My kick. Not Tae's. I lied.\" I held out my coin jar. \"This is for the glass. It's not enough. I know.\" He didn't say anything for a long time. Then he stepped aside.", "ko": "\"제 공이었어요. 제가 찼어요. 태가 아니에요. 거짓말했어요.\" 저금통을 내밀었다. 할아버지는 한참 말이 없더니 옆으로 비켜섰다."}, {"n": 10, "text": "The shed was full of balls. Hundreds of them, all pumped up and stitched with red thread. There was a photo on the wall of a young goalkeeper flying through the air. \"I fix them,\" Mr. Kang said. \"Then I give them back to anyone who knocks.\" He handed me Dad's ball. \"Funny thing is, nobody ever knocks.\"", "ko": "창고에는 빨간 실로 꿰맨 공이 수백 개 있었다. 벽에는 날아오르는 젊은 골키퍼 사진. \"고쳐서, 문 두드리는 사람한테 돌려준단다. 근데 아무도 안 두드리더구나.\""}, {"n": 11, "text": "On Saturday morning I helped fix the glass. I'd asked Tae to come too, and I told him everything. Mr. Kang gave Tae his old gloves. \"For the boy who got blamed,\" he said. Then he pointed at me. \"And you. Stop looking at the ball. Look where you want it to go.\" The match started at noon. We finished at 11:52.", "ko": "토요일 아침, 유리를 같이 끼웠다. 할아버지가 태에게 장갑을 줬다. \"누명 쓴 아이한테.\" 그리고 나에게. \"공 말고, 보내고 싶은 곳을 봐라.\" 11시 52분에 끝났다."}, {"n": 12, "text": "Late in the game I got the ball. I didn't look at it. I looked at the corner of the goal. The rocket kick flew straight for the first time in its life. Over the fence, a big old man with a white mustache was clapping. And this time, nothing broke.", "ko": "공을 받았다. 공이 아니라 골대 구석을 봤다. 로켓 킥이 처음으로 똑바로 날아갔다. 담 너머에서 할아버지가 박수를 쳤다. 이번엔 아무것도 깨지지 않았다."}]; let page=0, showKo=false; const $=id=>document.getElementById(id); const picture=$('picture'),overlay=$('overlay');
function render(){const s=scenes[page-1]; $('cover').hidden=!!s;picture.hidden=!s;$('count').textContent=s?`${page} / ${scenes.length}`:'A STORY';$('english').textContent=s?s.text:'';$('ko').textContent=s?s.ko:'';$('ko').hidden=!s||!showKo;$('toggle').hidden=!s;$('toggle').textContent=showKo?'Hide Korean':'Show Korean';$('toggle').setAttribute('aria-expanded',String(showKo));$('prev').disabled=page===0;$('next').disabled=page===scenes.length;if(s){picture.src=`images/scene-${String(page).padStart(2,'0')}.jpg`;picture.alt=`Scene ${page} illustration`;picture.tabIndex=0}}
function go(delta){const next=Math.max(0,Math.min(scenes.length,page+delta));if(next!==page){page=next;showKo=false;render()}}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('toggle').onclick=()=>{showKo=!showKo;render()};function openImage(){if(!page)return;$('large').src=picture.src;$('large').alt=picture.alt;overlay.hidden=false;$('close').focus()}function closeImage(){overlay.hidden=true;picture.focus()}picture.onclick=openImage;picture.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openImage()}};$('close').onclick=closeImage;overlay.onclick=e=>{if(e.target===overlay)closeImage()};document.addEventListener('keydown',e=>{if(!overlay.hidden){if(e.key==='Escape')closeImage();return}if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});let x=null,y=null;document.addEventListener('touchstart',e=>{if(!overlay.hidden)return;x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(x===null)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?1:-1);x=null;y=null},{passive:true});render();
</script></body></html>
