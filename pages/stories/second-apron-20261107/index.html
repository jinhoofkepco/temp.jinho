<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Second Apron</title>
<style>
:root{color-scheme:dark;--ink:#f5f0e6;--muted:#bdb8ad;--gold:#e5bf75;--bg:#111316}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}::selection{background:#e5bf75;color:#161616}.shell{width:min(100%,1024px);margin:auto;padding:28px 24px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;font:600 12px/1.2 system-ui,sans-serif;letter-spacing:.08em;color:var(--muted)}.top span:first-child{color:var(--ink)}.stage{width:100%;aspect-ratio:16/9;background:#090a0c;display:grid;place-items:center;overflow:hidden}.cover{background:#222c2c;text-align:center;padding:30px;position:relative}.cover:before,.cover:after{content:"";width:42px;height:1px;background:var(--gold);position:absolute;left:calc(50% - 21px)}.cover:before{top:23%}.cover:after{bottom:23%}.cover h1{font-weight:400;font-size:clamp(2.3rem,7vw,5.4rem);line-height:1.02;margin:0;max-width:8em;text-wrap:balance}.image-button{border:0;padding:0;background:#090a0c;width:100%;height:100%;display:grid;place-items:center}.image-button img{width:100%;height:100%;object-fit:contain}.copy{max-width:720px;margin:28px auto 0}.scene-label{font:600 12px/1.3 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}.english{font-size:clamp(1.1rem,2vw,1.35rem);line-height:1.65;margin:0}.ko-toggle{margin-top:24px;padding:8px 0;border:0;background:none;color:var(--gold);font:600 13px system-ui,sans-serif}.korean{font:1rem/1.8 system-ui,sans-serif;color:#d8d3c8;margin:8px 0 0}.nav{max-width:720px;margin:30px auto 0;padding-top:20px;border-top:1px solid #444641;display:flex;justify-content:space-between;gap:12px}.nav button,.close{border:1px solid #777568;border-radius:4px;background:transparent;color:var(--ink);padding:11px 18px;font:600 14px system-ui,sans-serif;min-width:90px}.nav button:disabled{opacity:.35;cursor:default}.nav button:not(:disabled):hover,.close:hover{background:#31352f}.fullscreen{position:fixed;inset:0;z-index:5;background:#050505;display:grid;place-items:center;padding:20px}.fullscreen[hidden]{display:none}.fullscreen img{width:100%;height:100%;object-fit:contain}.close{position:absolute;top:16px;right:16px;background:#151515}.hint{font:12px system-ui,sans-serif;color:var(--muted);text-align:right;margin:8px 0 0}@media(max-width:500px){.shell{padding:20px 16px 30px}.top{margin-bottom:15px}.copy{margin-top:22px}.english{font-size:1.1rem;line-height:1.65}.cover:before{top:18%}.cover:after{bottom:18%}}
</style></head><body><main class="shell"><div class="top"><span>THE SECOND APRON</span><span id="progress" aria-live="polite">A STORY IN EIGHT SCENES</span></div><div id="stage" class="stage"></div><p class="hint" id="hint" hidden>Tap image to enlarge</p><section class="copy" id="copy" hidden aria-live="polite"><p class="scene-label" id="label"></p><p class="english" id="english"></p><button class="ko-toggle" id="toggle" type="button" aria-expanded="false">Show Korean</button><p class="korean" id="korean" lang="ko" hidden></p></section><nav class="nav" aria-label="Story navigation"><button id="prev" type="button">Prev</button><button id="next" type="button">Begin</button></nav></main><div class="fullscreen" id="fullscreen" hidden role="dialog" aria-modal="true" aria-label="Enlarged scene image"><img id="large" src="images/scene-01.jpg" alt=""><button class="close" id="close" type="button">Close</button></div>
<script>
const scenes=[{"n": 1, "title": "The empty apron", "en": "This is the story of the Junior Cook-Off, and of an apron that belonged to someone else. Bomi's partner, her cousin Dami, woke up that morning with a fever. Without a partner, Bomi could not compete. So she held the spare apron out to her best friend. \"Nobody here has ever met Dami,\" she said. \"Please, Seo-ah. Just for one hour.\" Seo-ah could not cook. Everybody knew that. She could build almost anything, though.", "ko": "보미의 짝 다미가 열이 났다. 보미는 단짝 서아에게 앞치마를 내밀었다. \"아무도 다미를 몰라. 한 시간만.\" 서아는 요리를 못 한다. 대신 뭐든 만들 줄 안다."}, {"n": 2, "title": "\"This is Dami.\"", "en": "\"And this is Dami!\" said Bomi, as smoothly as butter. The host shook Seo-ah's hand. \"Welcome, Dami! Your hour starts... now!\" The giant hourglass flipped, and the sand began to fall. Seo-ah smiled so hard her cheeks hurt. It was the first lie. It would not be the last.", "ko": "\"얘가 다미예요!\" 사회자가 서아의 손을 흔들었다. 거대한 모래시계가 뒤집혔다. 서아는 볼이 아프도록 웃었다. 첫 번째 거짓말이었다."}, {"n": 3, "title": "The stirring machine", "en": "Seo-ah couldn't cook three sauces at once. Her machine could. In ten minutes she had built it out of rubber bands, string, clothes pegs and every wooden spoon she could find. A rolling pin rolled back and forth along a track and pulled the strings, and three spoons stirred three pots in perfect rhythm. The audience clapped. Even the twins at the next station stopped to watch.", "ko": "서아는 소스 세 개를 한꺼번에 못 젓는다. 하지만 기계는 할 수 있었다. 고무줄, 끈, 빨래집게, 나무 숟가락. 밀대가 오가며 세 냄비를 동시에 저었다."}, {"n": 4, "title": "Loose", "en": "Then a rubber band snapped. The rolling pin flew off its track, bounced once, and rolled across the floor. It rolled all the way to the twins' station and knocked against the leg of their counter. Their perfect tray of cream puffs slid, tipped, and fell.", "ko": "고무줄이 끊어졌다. 밀대가 튕겨 나가 바닥을 굴러 쌍둥이네 조리대 다리에 부딪혔다. 완벽한 슈 쟁반이 미끄러져 떨어졌다."}, {"n": 5, "title": "The floor was wet", "en": "\"What happened here?\" asked the host. Bomi answered before anyone else could. \"The floor was wet,\" she said. \"Their tray just slid.\" Seo-ah looked at the floor. A thin trail of flour ran from their station all the way to the twins' counter, as straight as a pencil line. Anyone looking from above could see exactly what had happened.", "ko": "\"무슨 일이죠?\" 보미가 먼저 답했다. \"바닥이 젖어서 미끄러졌어요.\" 바닥에는 밀가루 자국이 우리 조리대에서 쌍둥이 조리대까지 똑바로 이어져 있었다."}, {"n": 6, "title": "\"No.\"", "en": "\"If he asks you,\" Bomi whispered, \"just agree with me. Please. If they find out about Dami, we're out.\" Seo-ah looked at the twins on their knees, picking up cream puffs one by one. She pulled her wrist out of Bomi's hand. \"No,\" she said. It was a very small word. It was the hardest thing she said all day.", "ko": "\"물어보면 그냥 나랑 맞춰. 다미 일 들키면 끝이야.\" 서아는 바닥에서 슈를 줍는 쌍둥이를 봤다. \"싫어.\" 작은 말이었다. 그날 가장 어려운 말이었다."}, {"n": 7, "title": "The machine moves", "en": "Seo-ah carried her machine to the twins' counter and rebuilt it in four minutes. \"Your cream,\" she said, pointing. \"My machine whips. You pipe.\" The twins stared at her. Then they got to work. Behind them, Seo-ah and Bomi's own station sat empty, the sauces going cold. The sand kept falling.", "ko": "서아는 기계를 쌍둥이 조리대로 옮겨 4분 만에 다시 만들었다. \"크림은 기계가 칠게. 너희는 짜.\" 우리 조리대는 비어 있었다. 모래는 계속 떨어졌다."}, {"n": 8, "title": "The whole truth", "en": "When the sand ran out, Bomi walked up to the host by herself. She told him everything: about Dami, about the apron, about the rolling pin. Seo-ah and Bomi were disqualified, of course. The twins won second place. Later, on the back steps, the two friends ate burnt sauce straight from the pot. Then the twins came out with a plate. \"We saved you two,\" they said. They were the best cream puffs in the world.", "ko": "모래가 다 떨어지자 보미가 혼자 사회자에게 가서 다 말했다. 둘은 실격. 쌍둥이는 2등. 뒷계단에서 탄 소스를 먹고 있는데 쌍둥이가 슈 두 개를 들고 왔다. 세상에서 제일 맛있는 슈였다."}];let current=0,showKo=false;const $=id=>document.getElementById(id);const stage=$('stage'),modal=$('fullscreen');function render(){const s=scenes[current-1];$('progress').textContent=s?`SCENE ${current} / 8`:'A STORY IN EIGHT SCENES';$('copy').hidden=!s;$('hint').hidden=!s;$('prev').disabled=current===0;$('next').disabled=current===8;$('next').textContent=current===0?'Begin':'Next';if(!s){stage.className='stage cover';stage.innerHTML='<h1>The Second Apron</h1>';return}stage.className='stage';stage.innerHTML='';const btn=document.createElement('button');btn.className='image-button';btn.type='button';btn.setAttribute('aria-label',`Enlarge scene ${current}: ${s.title}`);const img=document.createElement('img');img.src=`images/scene-${String(current).padStart(2,'0')}.jpg`;img.alt=`Scene ${current}: ${s.title}`;btn.append(img);btn.onclick=()=>{$('large').src=img.src;$('large').alt=img.alt;modal.hidden=false;$('close').focus()};stage.append(btn);$('label').textContent=`Scene ${current} · ${s.title}`;$('english').textContent=s.en;$('korean').textContent=s.ko;$('korean').hidden=!showKo;$('toggle').textContent=showKo?'Hide Korean':'Show Korean';$('toggle').setAttribute('aria-expanded',String(showKo))}function go(delta){current=Math.max(0,Math.min(8,current+delta));render();window.scrollTo({top:0,behavior:'auto'})}$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('toggle').onclick=()=>{showKo=!showKo;render()};function close(){modal.hidden=true;stage.querySelector('button')?.focus()}$('close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.addEventListener('keydown',e=>{if(!modal.hidden){if(e.key==='Escape')close();return}if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});let x=0,y=0;stage.addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX;y=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?1:-1)},{passive:true});render();
</script></body></html>
