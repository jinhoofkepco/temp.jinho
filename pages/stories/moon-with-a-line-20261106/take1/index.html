<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Moon with a Line</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090b10;color:#f6f0e4}body{font-family:Georgia,serif;display:grid;place-items:center}main{width:min(100%,1100px);padding:clamp(16px,3vw,32px)}.screen{background:#000;aspect-ratio:2.39;display:grid;place-items:center;overflow:hidden}.screen img{width:100%;height:100%;object-fit:contain}.title{text-align:center;padding:1em;color:#eee1bd}.title .moon{font-size:clamp(2rem,9vw,5rem);color:#e9d39c}.title h1{font-size:clamp(1.5rem,5vw,3rem);font-weight:normal;margin:.1em 0}.title p{font:0.8rem system-ui;letter-spacing:.15em;text-transform:uppercase}.copy{max-width:760px;margin:clamp(18px,3vw,30px) auto;min-height:8rem}.english{font-size:clamp(1.15rem,2.5vw,1.65rem);line-height:1.5;margin:0}.gloss{font:0.95rem/1.6 system-ui;color:#bdb9ae}.controls{display:flex;align-items:center;gap:12px;max-width:760px;margin:auto;font:0.85rem system-ui}.controls button{border:1px solid #716b5f;background:#191b20;color:#f7f1e5;border-radius:5px;padding:11px 16px;cursor:pointer}.controls button:disabled{opacity:.35;cursor:default}.controls button:focus-visible{outline:2px solid #efd69a;outline-offset:3px}.count{flex:1;text-align:center;color:#bcb5a9}.gloss-button{font-size:.78rem}.hint{text-align:center;font:0.75rem system-ui;color:#8f8d89;margin-top:20px}@media(max-width:450px){main{padding:12px}.copy{min-height:10rem}.controls{gap:6px}.controls button{padding:10px}.hint{display:none}}
</style></head><body><main><div class="screen" id="screen"><div class="title" id="title"><div class="moon" aria-hidden="true">◯</div><h1>The Moon with a Line</h1><p>A shadow show</p></div><img id="image" hidden alt=""></div><section class="copy" aria-live="polite"><p class="english" id="english">A story in nine scenes.</p><p class="gloss" id="gloss" hidden></p></section><nav class="controls" aria-label="Story navigation"><button id="prev" type="button">← Previous</button><span class="count" id="count"></span><button class="gloss-button" id="toggle" type="button" aria-pressed="false">한국어 보기</button><button id="next" type="button">Next →</button></nav><p class="hint">Use the arrow keys or swipe to turn the page.</p></main>
<script>
const scenes=[{"en": "Mina held up the paper moon. “If it breaks, I’ll do the moon,” Joon said. A breeze lifted a paper star by the open door.", "ko": "미나가 달을 들자 준은 달이 부서지면 자기가 하겠다고 말해요. 열린 문으로 바람이 들어와요."}, {"en": "Mina pulled the moon past the table. Rip! A piece came off.", "ko": "미나가 달을 탁자 옆으로 당기다가 한 조각을 찢었어요."}, {"en": "“The wind tore it,” Mina said. “It blew the piece outside.”", "ko": "미나는 바람이 달을 찢고 조각을 밖으로 날렸다고 말해요."}, {"en": "Joon looked outside. Mina pressed her pocket and watched him.", "ko": "준은 밖에서 찾고, 미나는 주머니를 누르며 지켜봐요."}, {"en": "“I left the door open,” Joon said. “It’s my fault.” Mina looked down and held her pocket tight.", "ko": "준이 문을 열어 둔 자기 탓이라고 하자 미나는 주머니를 꼭 잡아요."}, {"en": "The show was about to start. “Wait,” Mina said, and took the piece out.", "ko": "공연이 곧 시작돼요. 미나는 조각을 꺼내요."}, {"en": "“I tore it,” Mina said. “I lied about the wind.”", "ko": "미나는 자기가 찢었고 바람 이야기는 거짓말이었다고 말해요."}, {"en": "“I’ll hold it,” Joon said. Mina pressed the tape down.", "ko": "준이 달을 잡아 주고 미나가 테이프를 붙여요."}, {"en": "The moon rose on the screen. A thin line ran through it.", "ko": "스크린에 달이 떠오르고 가느다란 선이 보여요."}];let page=0,showKorean=false;const $=id=>document.getElementById(id);function render(){const title=page===0;$('title').hidden=!title;$('image').hidden=title;if(!title){$('image').src=`images/scene-${String(page).padStart(2,'0')}.jpg`;$('image').alt=`Scene ${page} illustration`}$('english').textContent=title?'A story in nine scenes.':scenes[page-1].en;$('gloss').textContent=title?'':scenes[page-1].ko;$('gloss').hidden=title||!showKorean;$('count').textContent=title?'Title':`${page} / ${scenes.length}`;$('prev').disabled=page===0;$('next').disabled=page===scenes.length;$('next').textContent=title?'Begin →':'Next →';$('toggle').setAttribute('aria-pressed',showKorean);$('toggle').textContent=showKorean?'한국어 숨기기':'한국어 보기'}function move(n){page=Math.max(0,Math.min(scenes.length,page+n));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('toggle').onclick=()=>{showKorean=!showKorean;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let startX=0,startY=0;$('screen').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});$('screen').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)move(dx<0?1:-1)},{passive:true});render();
</script></body></html>
