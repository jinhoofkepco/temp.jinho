<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Moon with a Line</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#080808;color:#f5f1e8} body{font-family:Georgia,serif} button{font:inherit;cursor:pointer} main{width:min(100%,1000px);margin:auto;padding:clamp(16px,4vw,36px) 16px 28px} .top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#bdb7aa;font:13px system-ui,sans-serif;min-height:36px} .toggle{background:none;border:1px solid #777;color:#eee;border-radius:20px;padding:7px 12px;font:13px system-ui,sans-serif} .stage{margin-top:16px;aspect-ratio:16/9;background:#000;display:grid;place-items:center;overflow:hidden} .cover{text-align:center;padding:24px} .cover small{color:#d7b771;letter-spacing:.18em;text-transform:uppercase;font:11px system-ui,sans-serif}.cover h1{font-size:clamp(30px,6vw,62px);font-weight:normal;line-height:1.05;margin:18px 0}.cover p{color:#bdb7aa;font:14px system-ui,sans-serif}.image-button{border:0;padding:0;background:#000;width:100%;height:100%;display:block}.image-button img{width:100%;height:100%;object-fit:contain;display:block}.copy{max-width:740px;margin:24px auto;min-height:110px;font-size:clamp(20px,2.5vw,27px);line-height:1.5}.copy p{margin:0}.copy .ko{font:16px/1.7 system-ui,sans-serif;color:#c2bbb0;margin-top:14px} nav{max-width:740px;margin:auto;display:flex;justify-content:space-between;gap:16px} nav button{border:1px solid #827b6f;background:#171614;color:#f5f1e8;border-radius:4px;padding:12px 20px;min-width:100px} nav button:disabled{opacity:.35;cursor:default} button:focus-visible{outline:2px solid #e7bf6b;outline-offset:3px} dialog{border:0;padding:0;max-width:none;max-height:none;width:100vw;height:100dvh;background:#000} dialog::backdrop{background:#000} dialog img{width:100%;height:100%;object-fit:contain} dialog button{position:absolute;right:16px;top:16px;background:#222;color:white;border:1px solid #aaa;border-radius:50%;width:44px;height:44px;font:24px system-ui} [hidden]{display:none!important}@media(max-width:450px){main{padding:14px 12px 24px}.stage{margin-top:12px}.copy{margin:20px auto;font-size:20px;min-height:135px}}
</style></head><body><main><div class="top"><span id="progress">A story in ten scenes</span><button class="toggle" id="toggle" aria-pressed="false">한국어 보기</button></div><div class="stage" id="stage"><div class="cover" id="cover"><small>A story in ten scenes</small><h1>The Moon<br>with a Line</h1><p>Press Next to begin</p></div><button class="image-button" id="imageButton" aria-label="Open scene image full screen" hidden><img id="sceneImage" alt=""></button></div><div class="copy" aria-live="polite"><p id="en"></p><p id="ko" class="ko" lang="ko" hidden></p></div><nav aria-label="Story navigation"><button id="prev">← Prev</button><button id="next">Next →</button></nav></main><dialog id="viewer" aria-label="Full screen scene image"><img id="largeImage" alt=""><button id="close" aria-label="Close full screen">×</button></dialog><script>
const scenes=[{"en": "Mina held up the paper moon. Its shadow filled the screen. \"Careful,\" said Joon. \"If it breaks, I get the moon.\"", "ko": "미나가 종이 달을 들자 스크린에 그림자 달이 떠요. 준이 말해요. \"조심해. 망가지면 달은 내가 할 거야.\"", "img": "images/scene-01.jpg"}, {"en": "Mina turned too fast. The moon hit the table. Rrrip!", "ko": "미나가 너무 빨리 돌다가 달이 탁자에 걸려 찢어져요.", "img": "images/scene-02.jpg"}, {"en": "Footsteps! Mina pushed the piece into her pocket.", "ko": "발소리! 미나는 조각을 주머니에 쑥 넣어요.", "img": "images/scene-03.jpg"}, {"en": "\"What happened?\" asked Joon. Mina pointed at the door. \"The wind took a piece outside.\"", "ko": "\"어떻게 된 거야?\" 미나가 문을 가리켜요. \"바람이 조각을 밖으로 가져갔어.\"", "img": "images/scene-04.jpg"}, {"en": "Joon ran outside to look. On the screen, Mina's shadow held her pocket.", "ko": "준이 찾으러 뛰어나가요. 스크린 속 미나 그림자는 주머니를 꼭 쥐고 있어요.", "img": "images/scene-05.jpg"}, {"en": "Joon looked under the bench. He looked in the grass. Mina's hand stayed on her pocket.", "ko": "준은 벤치 밑도, 풀숲도 찾아봐요. 미나 손은 주머니에서 떨어지지 않아요.", "img": "images/scene-06.jpg"}, {"en": "\"I left the door open,\" said Joon. \"It's my fault.\" Children were sitting down. The show was almost starting.", "ko": "\"내가 문을 열어 둬서 그래. 내 잘못이야.\" 아이들이 자리에 앉기 시작해요.", "img": "images/scene-07.jpg"}, {"en": "\"Wait,\" said Mina. She opened her hand. \"I tore it. There was no wind.\"", "ko": "\"잠깐.\" 미나가 손을 펴요. \"내가 찢었어. 바람은 없었어.\"", "img": "images/scene-08.jpg"}, {"en": "Joon held the moon still. Mina pressed the tape down. \"Now I'm the moon,\" said Joon. Mina nodded.", "ko": "준이 달을 잡아 주고 미나가 테이프를 붙여요. \"이제 달은 내가 할게.\" 미나는 고개를 끄덕여요.", "img": "images/scene-09.jpg"}, {"en": "The moon rose on the screen. There was a thin line in it now. Mina watched it rise.", "ko": "스크린에 달이 떠올라요. 이제 그 달엔 가느다란 선이 있어요. 미나는 달이 뜨는 걸 지켜봐요.", "img": "images/scene-10.jpg"}]; let position=0,showKo=false;const $=id=>document.getElementById(id);const viewer=$('viewer');function render(){const s=scenes[position-1];$('cover').hidden=!!s;$('imageButton').hidden=!s;$('toggle').hidden=!s;$('progress').textContent=s?`Scene ${position} / ${scenes.length}`:'A story in ten scenes';$('en').textContent=s?s.en:'';$('ko').textContent=s?s.ko:'';$('ko').hidden=!s||!showKo;$('toggle').setAttribute('aria-pressed',showKo);$('toggle').textContent=showKo?'한국어 숨기기':'한국어 보기';$('prev').disabled=position===0;$('next').disabled=position===scenes.length;if(s){$('sceneImage').src=s.img;$('sceneImage').alt=`Scene ${position} illustration`;}}function move(delta){position=Math.max(0,Math.min(scenes.length,position+delta));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('toggle').onclick=()=>{showKo=!showKo;render()};$('imageButton').onclick=()=>{$('largeImage').src=scenes[position-1].img;$('largeImage').alt=`Scene ${position} illustration`;viewer.showModal()};$('close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});document.addEventListener('keydown',e=>{if(viewer.open)return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let touch=null;document.addEventListener('touchstart',e=>{if(!viewer.open&&e.touches.length===1)touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});document.addEventListener('touchend',e=>{if(!touch||viewer.open)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)move(dx<0?1:-1);touch=null},{passive:true});render();
</script></body></html>
