<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#100e14"><title>Lanternfall</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#100e14;color:#f6f0e9}*{box-sizing:border-box}body{margin:0;min-width:0}button{font:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #f5c57c;outline-offset:4px}main{max-width:1000px;margin:auto;padding:clamp(20px,4vw,42px) 20px 36px}.top{display:flex;justify-content:space-between;align-items:center;color:#bcb1b0;font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;margin-bottom:20px}.brand{color:#f0d1a9;font-weight:700}#stage{min-height:60vh}.cover{min-height:60vh;display:grid;place-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at 50% 65%,#553529 0%,#201922 40%,#151219 72%);border:1px solid #4b3734}.eyebrow,.label{color:#e9ad78;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:700}.cover h1{font-family:Georgia,serif;font-size:clamp(3.4rem,11vw,7rem);font-weight:400;letter-spacing:-.045em;margin:12px 0}.cover p{color:#d5c4b7;margin:0 0 30px}.primary{background:#e6b17e;color:#211817;border:0;border-radius:4px;padding:13px 23px;font-weight:700;justify-self:center}.frame{display:block;width:100%;aspect-ratio:16/9;background:#050407;border:0;padding:0;overflow:hidden}.frame img{display:block;width:100%;height:100%;object-fit:contain}.copy{max-width:720px;margin:26px auto 0}.label{margin-bottom:12px}.story{font-family:Georgia,serif;font-size:clamp(1.1rem,2.2vw,1.34rem);line-height:1.7;margin:0}.translation{color:#d1c4bd;margin-top:22px;font-size:.9rem;line-height:1.75}.translation summary{cursor:pointer;color:#d6ab88;width:max-content}.translation p{margin:10px 0 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:720px;margin:34px auto 0}.nav button{border:1px solid #74615d;background:transparent;color:#f5ede7;border-radius:4px;padding:11px 19px;min-width:90px}.nav button:disabled{opacity:.35;cursor:default}.count{font-size:.8rem;color:#b9a9a5;white-space:nowrap}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:3;display:grid;place-items:center;padding:52px 10px 10px}.overlay[hidden]{display:none}.overlay img{width:100%;height:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:18px;top:12px;border:1px solid #8a807d;border-radius:4px;color:white;background:#242025;padding:8px 13px}@media(max-width:500px){main{padding:20px 16px 28px}.top{margin-bottom:16px}.cover{min-height:55vh}.copy{margin-top:22px}.story{line-height:1.65}.nav{margin-top:28px}}
</style></head><body><main><div class="top"><span class="brand">Lanternfall</span><span id="progress">A story in nine scenes</span></div><div id="stage"></div><nav class="nav" aria-label="Story navigation"><button id="prev" type="button">← Prev</button><span class="count" id="count"></span><button id="next" type="button">Next →</button></nav></main><div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-label="Enlarged scene image"><button class="close" type="button" id="close">Close ✕</button><img id="large" alt=""></div>
<script>
const scenes=[{"n": 1, "en": "One second Hana was at her desk, and the next she was standing on a floating island in the sky. Across from her stood Yuna Kang, number one on every speed-run chart in the world. The rules glowed in the air between them: three lanterns, one tower, reach the top before the sun goes down. A tiny lantern creature popped up and bowed to them both. It did not say a word.", "ko": "하나와 1위 스피드러너 유나가 게임 속 하늘섬에 떨어졌다. 규칙: 등불 셋, 탑 하나, 해 지기 전에 꼭대기로. 말 없는 작은 등불 요정이 인사했다.", "focal": "Hana"}, {"n": 2, "en": "\"Here's the plan,\" Yuna said, walking fast. \"I'm faster, so I lead. You build bridges. I'll tell you where.\" She talked about routes and shortcuts and frame-perfect timing. Hana noticed something strange, though. Yuna kept one hand on the wall the whole time. And she never, ever looked down.", "ko": "\"내가 앞장서고 넌 다리를 만들어.\" 유나는 지름길 얘기를 늘어놓았다. 그런데 유나는 한 손을 늘 벽에 붙이고, 절대 아래를 보지 않았다.", "focal": "Yuna"}, {"n": 3, "en": "They climbed fast. Hana had to admit it: Yuna knew every route. But at a gap so small a kitten could jump it, Yuna stopped. \"Jumping's boring,\" she said. \"Bridge it.\" Behind her, the little lantern put its hands on its hips and stuck its chin up, exactly like Yuna. Hana almost laughed. She built the bridge anyway.", "ko": "둘은 빨리 올라갔다. 고양이도 뛸 만한 틈에서 유나가 멈췄다. \"점프는 지루해. 다리 놔.\" 뒤에서 등불 요정이 유나 흉내를 냈다.", "focal": "Hana"}, {"n": 4, "en": "The next gap was too wide for their last blocks. \"You jump,\" Yuna said quickly. \"My jump button is glitched. It's a lag thing.\" Hana had never practised big jumps. She was a builder. She jumped anyway, and she missed. One of their lanterns went grey and floated away into the sky. Two left.", "ko": "블록으로 못 메우는 넓은 틈. \"네가 뛰어. 내 점프 버튼이 버그 났어.\" 연습 안 한 하나가 뛰었다가 떨어졌다. 등불 하나가 꺼졌다.", "focal": "Yuna"}, {"n": 5, "en": "Back on the ledge, Hana demanded the truth. Yuna explained everything: input delay, controller drift, server problems. It was a very long explanation. Then Pip stepped between them. It made its tiny knees knock together. It covered its eyes, peeked down through its fingers, and shook all over. Nobody said anything. Pip didn't need words.", "ko": "유나는 입력 지연, 서버 문제… 긴 변명을 늘어놓았다. 그때 요정이 무릎을 덜덜 떨고, 눈을 가리고, 손가락 사이로 아래를 내려다보는 흉내를 냈다. 말이 필요 없었다.", "focal": "Hana"}, {"n": 6, "en": "Yuna tried one jump alone, just to prove she could. She froze at the edge and slipped, and the second lantern went grey. Now one lantern hung between them. \"We still have time,\" said Hana. \"We don't,\" said Yuna, without looking up. Inside the lantern, the little flame shivered.", "ko": "유나는 혼자 뛰어 보려다 미끄러졌다. 등불은 이제 하나. \"아직 시간 있어.\" \"없어.\" 등불 속 작은 불꽃이 떨었다.", "focal": ""}, {"n": 7, "en": "\"I've never done a jump,\" Yuna said quietly. \"Not once. Not in any game. I win by finding the long way around.\" She looked down for the first time, and her hands shook. \"But I can count. I can see the exact moment you should go. If you jump, I'll tell you when.\" Hana looked at her for a long second. Then she nodded.", "ko": "\"난 한 번도 점프한 적 없어. 늘 돌아가는 길을 찾았지.\" 유나가 처음으로 아래를 봤다. \"근데 타이밍은 정확히 보여. 네가 뛰면, 내가 언제인지 말해 줄게.\"", "focal": "Yuna"}, {"n": 8, "en": "The sun touched the edge of the world. \"Wait,\" said Yuna, flat on her stomach, watching the moving platform. \"Wait... wait... NOW!\" Hana ran and jumped. For one long moment she was flying, with the whole sun behind her.", "ko": "해가 지평선에 닿았다. \"기다려… 기다려… 지금!\" 하나가 뛰었다. 해를 등지고 날아올랐다.", "focal": "Hana"}, {"n": 9, "en": "They reached the top as the last light faded. Hana pulled Yuna up the final step, and Yuna didn't let go of her hand. Pip struck a victory pose, one arm up for Hana and one arm up for Yuna. \"Next time,\" said Yuna, \"teach me one small jump.\" \"Deal,\" said Hana. \"A kitten-sized one.\"", "ko": "둘은 꼭대기에 올랐다. 요정이 두 팔을 하나씩 들어 둘 다 흉내 냈다. \"다음엔 작은 점프 하나만 가르쳐 줘.\" \"좋아. 고양이 크기로.\"", "focal": "Yuna"}];let current=0;const stage=document.querySelector('#stage'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),count=document.querySelector('#count'),progress=document.querySelector('#progress'),overlay=document.querySelector('#overlay'),large=document.querySelector('#large');let opener;
function render(){overlay.hidden=true;if(!current){stage.innerHTML='<section class="cover"><span class="eyebrow">A story above the clouds</span><h1>Lanternfall</h1><p>Two rivals. One last lantern.</p><button class="primary" id="begin">Begin the story →</button></section>';document.querySelector('#begin').onclick=()=>go(1);progress.textContent='A story in nine scenes';count.textContent='Title';}else{const s=scenes[current-1];stage.innerHTML=`<button class="frame" id="imageButton" aria-label="Enlarge scene ${s.n} image"><img src="images/scene-${String(s.n).padStart(2,'0')}.jpg" alt="Illustration for scene ${s.n}"></button><section class="copy">${s.focal?`<div class="label">${s.focal}</div>`:''}<p class="story"></p><details class="translation"><summary>한국어 보기 · Korean</summary><p></p></details></section>`;stage.querySelector('.story').textContent=s.en;stage.querySelector('.translation p').textContent=s.ko;stage.querySelector('#imageButton').onclick=e=>{opener=e.currentTarget;large.src=opener.querySelector('img').src;large.alt=opener.querySelector('img').alt;overlay.hidden=false;document.querySelector('#close').focus()};progress.textContent=`Scene ${s.n} of 9`;count.textContent=`${s.n} / 9`;}prev.disabled=current===0;next.disabled=current===9;}
function go(n){if(n<0||n>9)return;current=n;render();window.scrollTo({top:0,behavior:'auto'})}prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);function close(){overlay.hidden=true;if(opener)opener.focus()}document.querySelector('#close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};document.addEventListener('keydown',e=>{if(!overlay.hidden){if(e.key==='Escape')close();return}if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});let touch=null;stage.addEventListener('touchstart',e=>{touch=[e.changedTouches[0].clientX,e.changedTouches[0].clientY]},{passive:true});stage.addEventListener('touchend',e=>{if(!touch||!overlay.hidden)return;let dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1));touch=null},{passive:true});render();
</script></body></html>
