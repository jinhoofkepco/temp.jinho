const D = DATA.duration, CH = DATA.chapters.map((c,i,a)=>({...c,end:a[i+1]?.t ?? D}));
const $ = id => document.getElementById(id), fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const group = c => /흙|soil|알갱이|분해|지렁이|굴 파는|토양층|정리/.test(c.title)?'var(--b)':/화학적 풍화 ·|탄산|지의류|속도|그래프/.test(c.title)?'var(--c)':'var(--a)';
const embedded = new URLSearchParams(location.search).get('embed') === '1';
if (embedded) {
 document.documentElement.classList.add('embedded');
 const style=document.createElement('style');
 style.textContent='html.embedded,html.embedded body{width:100%;height:100%;overflow:hidden}.embedded main{padding:0;margin:0;max-width:none;width:100%;height:100%}.embedded main>*:not(.stage){display:none!important}.embedded .stage{width:100%;height:100%;max-height:none;margin:0;border-radius:0;aspect-ratio:9/16}.embedded .bigplay{display:none!important}';
 document.head.append(style);
}
let loaded=false, chapter=-1, lastTime=-Infinity, raf=0;
const emit = data => { if(parent!==window) parent.postMessage(data,'*'); };
const at = t => Math.max(0,CH.findLastIndex(c=>t>=c.t));
CH.forEach(c=>{
 const s=document.createElement('div'); s.className='seg'; s.style.flex=`${c.end-c.t} 0 0`;s.style.setProperty('--g',group(c));s.title=c.title;s.append(document.createElement('i'));$('segs').append(s);c.el=s;
 const li=document.createElement('li'),b=document.createElement('button'),dot=document.createElement('span'),time=document.createElement('time'),label=document.createElement('span');
 dot.className='dot';dot.style.setProperty('--g',group(c));time.textContent=fmt(c.t);label.textContent=c.title;b.append(dot,time,label);b.onclick=()=>seek(c.t);li.append(b);$('list').append(li);c.li=b;
});
function paint(forceTime=false){
 const t=Math.min(D,v.currentTime||0),cur=at(t);
 if(loaded)frame.contentWindow.setFrame(t);
 CH.forEach((c,i)=>{c.el.firstChild.style.width=`${Math.max(0,Math.min(1,(t-c.t)/(c.end-c.t)))*100}%`;c.el.classList.toggle('cur',i===cur);c.li.classList.toggle('cur',i===cur);});
 const c=CH[cur],r=c.el.getBoundingClientRect(),tr=$('track').getBoundingClientRect();
 $('knob').style.left=`${r.left-tr.left+r.width*(t-c.t)/(c.end-c.t)}px`;
 $('title').textContent=c.title;$('time').textContent=`${fmt(t)} / ${fmt(D)}`;$('pp').textContent=v.paused?'▶':'❚❚';$('pp').setAttribute('aria-label',v.paused?'재생':'멈춤');$('stage').classList.toggle('playing',!v.paused||t>0);
 $('track').setAttribute('aria-valuenow',t);$('track').setAttribute('aria-valuetext',`${fmt(t)} ${c.title}`);
 if(chapter!==cur){chapter=cur;emit({type:'lesson:chapter',i:cur,title:c.title});}
 const now=performance.now();if(forceTime===true||now-lastTime>=250){lastTime=now;emit({type:'lesson:time',t});}
}
function tick(){paint();if(!v.paused&&!v.ended)raf=requestAnimationFrame(tick);}
async function play(){await ready;if(v.currentTime>=D)seek(0);try{await v.play();}catch(e){$('title').textContent=`재생할 수 없습니다: ${e.message}`;throw e;}}
async function resume(){await ready;await v.play();}
function pause(){const wasPaused=v.paused;v.pause();if(wasPaused)paint(true);}
function seek(t){if(!Number.isFinite(t))return;v.currentTime=Math.max(0,Math.min(D,t));paint(true);}
window.LESSON={duration:D,chapters:DATA.chapters,shots:DATA.shots||[],play,pause,resume,seek,get time(){return Math.min(D,v.currentTime||0);}};
function resize(){frame.style.transform=`scale(${$('stage').clientWidth/1080})`;paint();}
frame.srcdoc=BOARD;
const ready=new Promise(resolve=>frame.addEventListener('load',async()=>{await frame.contentWindow.ready;loaded=true;resize();emit({type:'lesson:ready'});resolve();},{once:true}));
window.ready=ready;
v.addEventListener('play',()=>{cancelAnimationFrame(raf);tick();});v.addEventListener('pause',()=>{cancelAnimationFrame(raf);paint(true);});v.addEventListener('seeked',paint);
v.addEventListener('ended',()=>{cancelAnimationFrame(raf);v.currentTime=D;paint(true);emit({type:'lesson:ended'});});
$('big').onclick=()=>play().catch(()=>{});$('pp').onclick=()=>v.paused?play().catch(()=>{}):pause();
$('track').tabIndex=0;$('track').setAttribute('aria-valuemin','0');$('track').setAttribute('aria-valuemax',D);
$('track').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();seek(e.key==='Home'?0:e.key==='End'?D:v.currentTime+(e.key==='ArrowLeft'?-5:5));}};
function xTime(x){for(const c of CH){const b=c.el.getBoundingClientRect();if(x<=b.right+1.5||c===CH.at(-1))return c.t+Math.max(0,Math.min(1,(x-b.left)/b.width))*(c.end-c.t);}return 0;}
let drag=false;const track=$('track');
track.onpointerdown=e=>{drag=true;track.setPointerCapture(e.pointerId);seek(xTime(e.clientX));};track.onpointermove=e=>{if(drag)seek(xTime(e.clientX));};track.onpointerup=track.onpointercancel=()=>{drag=false;};
window.addEventListener('resize',resize);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe($('stage'));
window.addEventListener('message',e=>{if(e.source!==parent||!e.data)return;const m=e.data;if(m.type==='lesson:seek')seek(m.t);if(m.type==='lesson:play')play().catch(()=>{});if(m.type==='lesson:pause')pause();if(m.type==='lesson:resume')resume().catch(()=>{});});

</script></body></html>
