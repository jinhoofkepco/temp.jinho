<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lesson</title>
<style>
:root{color-scheme:light;--paper:#f6f4ee;--ink:#1f1f24;--muted:#575650;--track:#dedad0;--accent:#a52428}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}::selection{background:#e6c3ac}button{font:inherit;min-width:44px;min-height:44px;cursor:pointer;touch-action:manipulation;user-select:none;color:inherit;border:1px solid var(--track);border-radius:10px;background:transparent;padding:8px}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button[aria-current=true]{border-color:var(--accent)}
main{height:100vh;height:100dvh;display:flex;gap:24px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));align-items:center;justify-content:center}
#stage{height:100%;aspect-ratio:9/16;flex:none;overflow:hidden;background:var(--paper)}iframe{display:block;width:100%;height:100%;border:0}#panel{flex:1;min-width:0;max-width:620px;height:100%;display:flex;flex-direction:column;gap:12px}h1{font-size:18px;line-height:1.3;margin:0}h2{font-size:24px;line-height:1.25;margin:0;overflow-wrap:anywhere}#ko{display:none;margin:4px 0;color:var(--muted)}#caption{font-size:20px;line-height:1.5;overflow:auto;min-height:0;flex:1;white-space:pre-line;overflow-wrap:anywhere}#status{font-size:14px;color:var(--muted);margin:0;min-height:20px}#controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#pp{background:var(--ink);color:var(--paper)}#progress{display:flex;gap:4px;min-height:44px}#progress button{position:relative;flex:var(--weight) 1 0;min-width:44px;padding:0;overflow:hidden;font-variant-numeric:tabular-nums}#progress button i{position:absolute;inset:0 auto 0 0;width:0;background:#dfc6b2;pointer-events:none}#progress button span{position:relative}#meta{display:flex;align-items:center;justify-content:space-between;gap:8px}#help{font-size:14px}#status:empty{display:none}#heading{min-height:0;max-height:140px;overflow:auto;flex:none}#clock{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
@media(max-aspect-ratio:1/1){main{flex-direction:column;gap:6px;padding:6px 12px}#stage{height:calc(100dvh - 246px);width:auto;max-width:100%;flex:none}#panel{flex:none;width:100%;height:228px;gap:4px}h1{font-size:12px;line-height:16px}h2{font-size:15px;line-height:18px}#heading{max-height:18px}#caption{font-size:15px;line-height:19px;min-height:42px}#ko{font-size:14px;line-height:18px;margin:2px 0}#controls{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}#controls button{font-size:13px;padding:4px}#meta{height:44px;flex:none}#help{min-height:44px}#progress{flex:none}#status{position:absolute;left:16px;top:8px;background:var(--paper)}}
</style></head><body><main><div id="stage"></div><section id="panel" aria-label="Lesson controls"><h1 id="unitTitle"></h1><div id="heading"><h2 id="chapterTitle"></h2><p id="ko"></p></div><div id="caption" aria-label="Current caption"></div><p id="status" role="status"></p><nav id="progress" aria-label="Chapter progress"></nav><div id="controls"><button id="prev">Previous</button><button id="pp">Play</button><button id="next">Next</button><button id="replay">Replay</button></div><div id="meta"><div id="clock"></div><button id="help" aria-pressed="false">한국어 도움</button></div></section></main><script src="unit-data.js"></script><script src="unit_player.js"></script></body></html>
